<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YL_contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>

  /* RESET */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  *::-webkit-scrollbar {
    display: none;
  }

  body {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    color: rgb(26, 26, 26);
  }

  /* ===== GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    height: 100vh;
  }

  /* ===== CELL ===== */
  .cell {
    border: 0px;
  }

  .content {
    padding: 10px;
    font-size: 18px;
    letter-spacing: -2%;
    font-weight: 500;
  }

  .contact {
    padding: 10px;
    padding-top: 0px;
    font-size: 18px;
    letter-spacing: -2%;
    font-weight: 500;
  }

  .content-nameEN {
    font-family:'Inter', sans-serif;
    padding: 10px;
    font-size: 22px;
    padding-bottom: 0;
    line-height: 20px;
    font-weight: 500;
    letter-spacing: 1%;
  }

  .content-nameCN {
    padding: 10px;
    padding-top: 2px;
    font-size: 18px;
    font-weight: 500;
  }

  /* ===== LEFT STRUCTURE ===== */

  .merge-a {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
  }

  .merge-b {
    grid-column: 1 / 2;
    grid-row: 3 / 5;
  }

  /* navigation */
  .merge-2a { grid-column: 2 / 3; grid-row: 1 / 2; }
  .merge-2b { grid-column: 3 / 4; grid-row: 1 / 2; }
  .merge-2c { grid-column: 4 / 5; grid-row: 1 / 2; }
  .merge-2d { grid-column: 5 / 6; grid-row: 1 / 2; }

  .merge-bodytext{
    grid-column: 5 / 7;
    grid-row: 2 / 8;
  }

  /* ===== 关闭弹性滚动 ===== */
  html, body {
    overscroll-behavior: none;
    overflow: hidden;
  }

  /* 👉 保证链接不变样式 */
  a {
    text-decoration: none;
    color: inherit;
  }

  </style>
</head>

<body>

<div class="grid">

  <div class="merge-up"></div>

  <!-- 左上名字（回首页） -->
  <div class="cell merge-a">
    <a href="index.html">
      <div class="content-nameEN">lyu,<br>yimeng</div>
      <div class="content-nameCN">吕奕蒙</div>
    </a>
  </div>

  <div class="cell merge-b">
    <div class="content-gray"></div>
  </div>

  <!-- navigation -->
  <div class="cell merge-2a">
    <a href="about.html"><div class="content">About</div></a>
  </div>

  <div class="cell merge-2b">
    <a href="gallery.html"><div class="content">Gallery</div></a>
  </div>

  <div class="cell merge-2c">
    <a href="research.html"><div class="content">Research</div></a>
  </div>

  <div class="cell merge-2d">
    <a href="contact.html"><div class="content">[Contact]</div></a>
  </div>

  <!-- contact正文 -->
  <div class="merge-bodytext">
    <div class="contact">

      <p>
      Email: <br>
      ylyu37@jh.edu<br>
      <br><br>
      </p>

      <p>
      Ins: <br>
      gnemiyuyl <br>
      <br><br>
      </p>

      <p>
      Website: <br>
      xxxx.xxx <br>
      </p>
      <br><br>

    </div>
  </div>

</div>

</body>
</html>
