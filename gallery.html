<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
*::-webkit-scrollbar { display: none; }

body {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  color: rgb(26, 26, 26);
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  height: 100vh;
}

/* ===== TEXT ===== */
.content {
  padding: 10px;
  font-size: 18px;
}

  .content-nameEN {
    font-family:'Inter', sans-serif;
    padding: 10px;
    font-size: 22px;
    padding-bottom: 0;
    line-height: 20px;
    font-weight: 500;
    letter-spacing: 1%;
  }

.content-nameCN {
    padding: 10px;
    padding-top: 2px;
    font-size: 18px;
    font-weight: 500;
}

/* ===== NAV ===== */
.merge-a { grid-column: 1 / 2; grid-row: 1 / 2; }

.merge-2a { grid-column: 2 / 3; grid-row: 1 / 2; }
.merge-2b { grid-column: 3 / 4; grid-row: 1 / 2; }
.merge-2c { grid-column: 4 / 5; grid-row: 1 / 2; }
.merge-2d { grid-column: 5 / 6; grid-row: 1 / 2; }

/* ===== GALLERY ===== */
.merge-list{
  grid-column: 2 / 3;
  grid-row: 2 / 9;
  overflow-y: auto;
}

.merge-description{
  opacity: 60%;
  grid-column: 3 / 4;
  grid-row: 2 / 9;
  overflow-y: auto;
  padding: 10px;
}

.merge-image{
  grid-column: 4 / 9;
  grid-row: 2 / 9;
  overflow-y: auto;
  z-index: 10;  /* 添加这一行 */
}

.merge-statement{
  grid-column: 7 / 9;
  grid-row: 1 / 9;
  overflow-y: auto;
  background-color: rgb(239, 239, 239);
  padding: 10px;
  padding-right: 20px;
  z-index: 5; /* 添加这一行 */
}


/* ===== NAV LIST STYLE ===== */
.nav a {
  display: block;
  padding: 10px;
  font-size: 16px;
  text-decoration: none;
  color: inherit;
}

.nav a.active::before {
  content: "[";
}

.nav a.active::after {
  content: "]";
}

/* ===== IMAGE ===== */
.merge-image img {
  width: 100%;
  display: block;
}

/* ===== 禁止整体滚动 ===== */
html, body {
  overflow: hidden;
  overscroll-behavior: none;
}

</style>
</head>

  Artist Statement:

    <br><br>

My formal undergraduate education in studio art began remotely at the onset of the COVID-19 and was completed in Boston during the pandemic.
    <br><br>
My practice is influenced by and reflects on the places I have lived, including their built environments 
and histories, as well as their relationship to my home city, Taiyuan.
    <br><br>
I often work with found materials, including physical objects, digital media, and words—both my own 
and collected from elsewhere. My visual method, while mixed-media, is grounded in drawing (as embodied 
ways of thinking) and printmaking (as histories and technologies of image-making).
    <br><br>
Themes of physical and mental health tend to recur in my work, sometimes deliberately, sometimes intuitively. 
When they do, I approach them with an awareness of sociological and historical perspectives on medicine, 
and remain attentive to how they are engaged with and represented.

Last updated: May 2026
